---
# backup-monitor: staleness detection and integrity checks for restic repos.
#
# Runs on the backup host (vps06). Auto-discovers backup directories under the
# base path (Hestia and Coolify workloads), then for each restic-* repo:
#   1. Checks the latest snapshot age (fails if > staleness threshold)
#   2. Runs `restic check --read-data-subset=1%` for lightweight integrity
#
# Requires a recovery password per repo family. Set via:
#   group_vars/backup_monitor/vault.yml  or  playbook vars.

backup_monitor_base_path: /home/backuper/backup

# Maximum hours since last snapshot before alerting.
backup_monitor_staleness_hours: 28

# Timeout per repo for restic check (seconds).
backup_monitor_check_timeout: 1800

# Fraction of pack data to verify during check (0 = structure only).
# 1% is a good balance: catches corruption without hours of I/O.
backup_monitor_check_read_fraction: 1%

# Legacy (non-restic) Hestia backups: <user>.<date>.tar archives stored
# directly under <base_path>/<host>/. Any host directory containing at least
# one matching archive is checked for freshness automatically. Add hosts to
# backup_monitor_legacy_hosts to also flag a host whose backups stopped
# completely (zero archives).
backup_monitor_legacy_glob: '*.tar*'
backup_monitor_legacy_staleness_hours: 28
backup_monitor_legacy_hosts: []

# Restic repository password (recovery key passphrase) used for repos that do
# not have a specific entry in backup_monitor_host_passwords.
# Must be set via playbook vars or group_vars/backup_monitor/vault.yml.
backup_monitor_restic_password: ""

# Per host-directory restic password, for repos that use another key. The
# Coolify repos (workload hosts) carry an ansible-recovery key opened with
# coolify_restic_recovery_password instead of the Hestia recovery passphrase.
backup_monitor_host_passwords: {}

# Host directories under base_path to skip (e.g., non-backup directories).
backup_monitor_skip_dirs:
  # Retired UGD (digital-gov-mg) backups: no longer updated, so they would
  # always be reported as stale. Kept on disk; just not monitored here.
  - vps13
  - vps13samifin
  - prea.gov.mg
  - hr.digital.gov.mg

# Individual repos (relative to base_path) to skip: orphaned names left behind
# when a Coolify project's public domain changed. The project is still backed
# up, under its new repo name.
backup_monitor_skip_repos:
  - vps11/restic-hr.digital.gov.mg
  - vps11/restic-mission.eto.mg

# If false, stale snapshots produce warnings only (don't fail the playbook).
backup_monitor_strict_staleness: true

# ---------------------------------------------------------------------------
# Restore verification ("drill")
# ---------------------------------------------------------------------------
# Freshness and `restic check` prove the repository is intact; they do not prove
# that the payload can be read back. The drill streams real files out of the
# newest snapshot and validates them, which is the check that actually fails on
# recovery day.
#
# It needs no extra disk or VM: only one file is read per repo, and only a
# bounded number of repos is drilled per weekly run. The monitor already uses
# the *recovery* passphrases (backup_monitor_restic_password and
# backup_monitor_host_passwords), so a passing drill also proves that the
# escrowed recovery key opens the repository.
backup_monitor_drill_enabled: true

# Repos to verify per weekly run. The rotation covers every repo over time
# without making a single run expensive. Every repo is drilled at least monthly
# (4 per week over the current 12 repos = a 3-week cycle).
backup_monitor_drill_repos_per_run: 4

# Only files up to this size are streamed into a validator (2 GiB).
backup_monitor_drill_max_file_bytes: 2147483648

# Timeout for the per-repo drill (seconds).
backup_monitor_drill_timeout: 1800

# Where the drilled payload is restored to. Only one file at a time is written,
# and it is deleted again immediately, so this needs room for a single file, not
# for a copy of the repository. Keep it off the volume that holds the backups so
# a drill can never fill the only copy.
backup_monitor_drill_scratch_dir: /var/tmp/backup-monitor-drill

# One JSON evidence file per run (the drill results), so a gap in the history is
# itself visible.
backup_monitor_drill_report_dir: /var/log/backup-monitor

# Snapshot files that look like a restorable payload, by extension. The largest
# matching file within the size cap is used, because a big dump is stronger
# evidence than a small one.
backup_monitor_drill_file_pattern: '\.(sql\.gz|sql|dump|tar\.gz|tgz|tar)$'

# A snapshot that contains no dump or archive is an error by default: it means
# either that the backup stopped producing one, or that nobody has ever checked
# what the repository holds - the failure mode that hid a five-month backup
# outage before. List the repos that legitimately have no payload here; they are
# still verified, against their largest regular file, and reported as
# no_payload_allowed instead of passing as a normal payload.
backup_monitor_drill_allow_no_payload: []

# Optional per-repo override: "<host-dir>/<repo>" -> path inside the snapshot.
# Useful when a repo holds several dumps and only one is worth loading, e.g. the
# main application database. Example:
#   backup_monitor_drill_files:
#     vps11/restic-mysite: /data/coolify/backups/generated/mysite/auto-db.sql.gz
backup_monitor_drill_files: {}
