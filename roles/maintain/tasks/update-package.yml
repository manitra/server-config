
- name: Configure apt phased updates handling
  become: true
  tags: apt_phasing
  block:
    - name: Install phased-updates apt drop-in
      copy:
        dest: "{{ maintain_apt_phased_updates_conf }}"
        mode: '0644'
        content: |
          // Managed by Ansible (roles/maintain). Do not edit by hand.
          APT::Get::Always-Include-Phased-Updates "true";
      when: maintain_apt_include_phased_updates | bool

    - name: Remove phased-updates apt drop-in when disabled
      file:
        path: "{{ maintain_apt_phased_updates_conf }}"
        state: absent
      when: not maintain_apt_include_phased_updates | bool

# dpkg has no lock-wait option of its own, so let apt wait for the frontend
# lock and drive `dpkg --configure`. --no-remove keeps a repair from ever
# uninstalling packages to satisfy broken dependencies.
- name: Repair any interrupted dpkg state
  command: apt-get -o DPkg::Lock::Timeout=1800 --no-remove --fix-broken install -y
  changed_when: false

- name: Find deprecated ondrej/php apt source files
  become: true
  find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*ondrej*"
      - "*sury*php*"
    file_type: file
  register: _ondrej_files

- name: Remove deprecated ondrej/php PPA
  become: true
  block:
    - name: Remove ondrej/php apt sources
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _ondrej_files.files }}"

    - name: Remove legacy ondrej GPG key
      apt_key:
        id: 14AA40EC0831756756D7F66C4F4EA0AAE5267A6C
        state: absent
      ignore_errors: true

    - name: Refresh apt cache after PPA removal
      command: apt-get update --allow-releaseinfo-change
      changed_when: false
  when: _ondrej_files.files | length > 0

- name: Update APT packages
  apt:
    upgrade: dist
    update_cache: yes
    lock_timeout: 1800
  register: _apt_update
  ignore_errors: true

- name: Retry apt update with releaseinfo change acceptance
  command: apt-get update --allow-releaseinfo-change && apt-get dist-upgrade -y
  changed_when: true
  when: _apt_update is failed